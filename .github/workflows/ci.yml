name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  test:
    # Exercise local session and file handling across supported operating systems.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Skips the postinstall Playwright chromium download. Nothing in the
      # default test suite launches a browser. Real-browser fixtures run opt-in.
      - run: npm ci --ignore-scripts

      - name: Type check
        run: npm run build

      - name: Test
        run: npm run test:run
